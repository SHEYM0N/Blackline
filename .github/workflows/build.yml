name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.3"

    steps:
      - uses: actions/checkout@v4

      - name: Download free CC0 PBR textures (optional - the game has procedural fallbacks)
        run: |
          mkdir -p tex
          cd tex
          for id in PaintedPlaster017 WoodFloor041 Ground037 Bark001 Concrete034; do
            curl -fsSL -m 90 -o t.zip "https://ambientcg.com/get?file=${id}_1K-JPG.zip" && unzip -oq t.zip || echo "skipped $id"
          done
          rm -f t.zip *.usda *.mtlx *.png || true
          ls

      - name: Install Godot and export templates
        run: |
          B="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Android SDK, debug keystore, editor settings
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" > /dev/null
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Import assets and export APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build

          echo "Starting Godot asset import (10 minute limit)..."
          timeout 10m godot --headless --path . --import --verbose 2>&1 | tee build/import.log

          echo "Starting Android APK export (10 minute limit)..."
          timeout 10m godot --headless --path . --export-debug "Android" build/blackline.apk 2>&1 | tee build/export.log

          test -s build/blackline.apk
          echo "APK created successfully."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackline-apk
          path: build/
          if-no-files-found: warn
